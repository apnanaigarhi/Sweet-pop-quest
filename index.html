<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Sweet Pop Quest</title>
<style>
:root{
  --bg1:#ff8fcf;
  --bg2:#8a6cff;
  --panel:#ffffffdd;
  --text:#4a225c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));}
body{display:flex;justify-content:center;align-items:center;color:var(--text)}
.app{
  width:100%;
  max-width:520px;
  height:100dvh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 10%,#fff7 0 5%,transparent 5.5%),
    radial-gradient(circle at 85% 25%,#fff5 0 3%,transparent 3.5%),
    linear-gradient(160deg,#ff9bd4,#876bff 75%);
}
.top{
  padding:14px 14px 8px;
  position:relative;
  z-index:5;
}
.title{
  text-align:center;
  font-size:29px;
  font-weight:1000;
  color:white;
  text-shadow:0 3px 0 #a23d97,0 6px 14px #0003;
  letter-spacing:.5px;
  margin-bottom:10px;
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}
.stat{
  background:var(--panel);
  border:3px solid #fff;
  border-radius:17px;
  text-align:center;
  padding:8px 4px;
  box-shadow:0 8px 18px #43165733;
}
.label{font-size:11px;font-weight:900;opacity:.65;text-transform:uppercase}
.value{font-size:21px;font-weight:1000;margin-top:2px}
.goalbar{
  margin:10px 3px 0;
  height:15px;
  background:#4e29666b;
  border:2px solid #ffffffaa;
  border-radius:999px;
  overflow:hidden;
}
.goalfill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ffe85b,#ff933d);
  border-radius:999px;
  transition:width .3s;
}
.game-wrap{
  width:min(94vw,490px);
  margin:7px auto 0;
  padding:8px;
  background:#6b3c8799;
  border:3px solid #ffffffb5;
  border-radius:24px;
  box-shadow:0 14px 35px #35125055,inset 0 0 15px #fff2;
}
#board{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:5px;
  aspect-ratio:1/1;
}
.cell{
  position:relative;
  border-radius:13px;
  background:#ffffff18;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:visible;
  touch-action:none;
}
.candy{
  width:88%;
  height:88%;
  border-radius:50%;
  box-shadow:
    inset 0 7px 7px #ffffff8f,
    inset 0 -8px 8px #00000020,
    0 4px 6px #30113f4d;
  transition:transform .13s ease,opacity .16s ease;
  position:relative;
}
.candy:before{
  content:"";
  position:absolute;
  width:35%;
  height:18%;
  left:18%;
  top:14%;
  background:#fff8;
  border-radius:50%;
  transform:rotate(-25deg);
}
.candy.red{background:linear-gradient(145deg,#ff7185,#ee3155)}
.candy.blue{background:linear-gradient(145deg,#70d9ff,#2587ef)}
.candy.green{background:linear-gradient(145deg,#89ee84,#36b747);border-radius:33% 67% 35% 65%/55% 40% 60% 45%}
.candy.yellow{background:linear-gradient(145deg,#fff37b,#f6bd2e);border-radius:26% 74% 63% 37%/46% 35% 65% 54%}
.candy.purple{background:linear-gradient(145deg,#dd8cff,#913ee1);border-radius:45% 55% 30% 70%/60% 35% 65% 40%}
.candy.orange{background:linear-gradient(145deg,#ffba67,#ff722f);border-radius:60% 40% 65% 35%/40% 65% 35% 60%}
.selected .candy{
  transform:scale(1.11);
  outline:4px solid white;
  outline-offset:1px;
}
.pop .candy{
  transform:scale(.15) rotate(25deg);
  opacity:0;
}
.footer{
  text-align:center;
  color:white;
  font-size:12px;
  font-weight:700;
  margin-top:8px;
  text-shadow:0 2px 5px #0005;
}
.overlay{
  position:absolute;
  inset:0;
  z-index:20;
  background:#3d1653b8;
  backdrop-filter:blur(8px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
}
.card{
  width:100%;
  max-width:390px;
  background:#fff;
  border:4px solid #fff;
  border-radius:28px;
  text-align:center;
  padding:26px 20px;
  box-shadow:0 25px 65px #210c3588;
}
.card h1{
  font-size:34px;
  color:#a43db6;
  margin-bottom:8px;
}
.card p{font-size:15px;line-height:1.45;margin-bottom:17px}
.btn{
  border:0;
  padding:14px 23px;
  border-radius:18px;
  background:linear-gradient(135deg,#ff60ad,#875fff);
  color:#fff;
  font-size:18px;
  font-weight:1000;
  box-shadow:0 8px 18px #8a3d9955;
}
.hidden{display:none!important}
.burst{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:radial-gradient(circle,#fff8 0 3%,transparent 35%);
  animation:flash .25s ease-out;
}
@keyframes flash{from{opacity:1}to{opacity:0}}
@media(max-height:690px){
  .title{font-size:23px;margin-bottom:5px}
  .top{padding-top:7px}
  .stat{padding:5px 3px}
  .value{font-size:17px}
  .game-wrap{margin-top:3px}
  .footer{margin-top:4px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="title">🍭 Sweet Pop Quest</div>
    <div class="stats">
      <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Moves</div><div class="value" id="moves">25</div></div>
      <div class="stat"><div class="label">Goal</div><div class="value" id="goal">2500</div></div>
    </div>
    <div class="goalbar"><div class="goalfill" id="goalfill"></div></div>
  </div>

  <div class="game-wrap">
    <div id="board"></div>
  </div>
  <div class="footer">Tap two adjacent candies or swipe to swap</div>

  <div class="overlay" id="start">
    <div class="card">
      <h1>Sweet Pop Quest</h1>
      <p>Match 3 or more candies, make combos and reach the target before your moves run out.</p>
      <button class="btn" id="startBtn">PLAY NOW</button>
    </div>
  </div>

  <div class="overlay hidden" id="end">
    <div class="card">
      <h1 id="endTitle">Great!</h1>
      <p id="endText"></p>
      <button class="btn" id="restartBtn">PLAY AGAIN</button>
    </div>
  </div>
</div>

<script>
const ROWS=8,COLS=8;
const TYPES=["red","blue","green","yellow","purple","orange"];
let board=[],score=0,moves=25,goal=2500,busy=false,selected=null;
let touchStart=null;

const boardEl=document.getElementById("board");
const scoreEl=document.getElementById("score");
const movesEl=document.getElementById("moves");
const goalEl=document.getElementById("goal");
const goalFill=document.getElementById("goalfill");
const startOverlay=document.getElementById("start");
const endOverlay=document.getElementById("end");
const endTitle=document.getElementById("endTitle");
const endText=document.getElementById("endText");

function randCandy(){
  return TYPES[Math.floor(Math.random()*TYPES.length)];
}
function idx(r,c){return r*COLS+c}
function inBounds(r,c){return r>=0&&r<ROWS&&c>=0&&c<COLS}
function adjacent(a,b){
  return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1;
}
function createBoard(){
  board=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      let t;
      do{
        t=randCandy();
      }while(
        (c>=2 && board[r][c-1]===t && board[r][c-2]===t) ||
        (r>=2 && board[r-1][c]===t && board[r-2][c]===t)
      );
      board[r][c]=t;
    }
  }
  ensurePossibleMove();
}
function render(){
  boardEl.innerHTML="";
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const cell=document.createElement("div");
      cell.className="cell";
      cell.dataset.r=r; cell.dataset.c=c;
      if(selected && selected.r===r && selected.c===c) cell.classList.add("selected");
      const candy=document.createElement("div");
      candy.className="candy "+board[r][c];
      cell.appendChild(candy);

      cell.addEventListener("click",()=>pick(r,c));
      cell.addEventListener("touchstart",e=>{
        const t=e.touches[0];
        touchStart={x:t.clientX,y:t.clientY,r,c};
      },{passive:true});
      cell.addEventListener("touchend",e=>{
        if(!touchStart || busy) return;
        const t=e.changedTouches[0];
        const dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;
        if(Math.max(Math.abs(dx),Math.abs(dy))>18){
          let nr=touchStart.r,nc=touchStart.c;
          if(Math.abs(dx)>Math.abs(dy)) nc+=dx>0?1:-1;
          else nr+=dy>0?1:-1;
          if(inBounds(nr,nc)) attemptSwap({r:touchStart.r,c:touchStart.c},{r:nr,c:nc});
        }
        touchStart=null;
      },{passive:true});
      boardEl.appendChild(cell);
    }
  }
  updateHUD();
}
function updateHUD(){
  scoreEl.textContent=score;
  movesEl.textContent=moves;
  goalEl.textContent=goal;
  goalFill.style.width=Math.min(100,(score/goal)*100)+"%";
}
function pick(r,c){
  if(busy) return;
  if(!selected){selected={r,c};render();return;}
  const next={r,c};
  if(selected.r===r && selected.c===c){selected=null;render();return;}
  if(adjacent(selected,next)){
    const a=selected;
    selected=null;
    attemptSwap(a,next);
  }else{
    selected=next;render();
  }
}
async function attemptSwap(a,b){
  if(busy || moves<=0) return;
  busy=true;
  swap(a,b);
  render();
  await wait(130);
  let matches=findMatches();
  if(matches.size===0){
    swap(a,b);
    render();
    await wait(130);
    busy=false;
    return;
  }
  moves--;
  await resolveMatches();
  busy=false;
  checkEnd();
}
function swap(a,b){
  const t=board[a.r][a.c];
  board[a.r][a.c]=board[b.r][b.c];
  board[b.r][b.c]=t;
}
function findMatches(){
  const matched=new Set();
  for(let r=0;r<ROWS;r++){
    let run=1;
    for(let c=1;c<=COLS;c++){
      if(c<COLS && board[r][c]===board[r][c-1]) run++;
      else{
        if(run>=3) for(let k=0;k<run;k++) matched.add(idx(r,c-1-k));
        run=1;
      }
    }
  }
  for(let c=0;c<COLS;c++){
    let run=1;
    for(let r=1;r<=ROWS;r++){
      if(r<ROWS && board[r][c]===board[r-1][c]) run++;
      else{
        if(run>=3) for(let k=0;k<run;k++) matched.add(idx(r-1-k,c));
        run=1;
      }
    }
  }
  return matched;
}
async function resolveMatches(){
  let combo=1;
  while(true){
    const matches=findMatches();
    if(matches.size===0) break;
    markPops(matches);
    score += matches.size*100*combo;
    updateHUD();
    await wait(180);
    for(const id of matches){
      const r=Math.floor(id/COLS),c=id%COLS;
      board[r][c]=null;
    }
    collapse();
    refill();
    render();
    await wait(180);
    combo++;
  }
  ensurePossibleMove();
  render();
}
function markPops(matches){
  for(const id of matches){
    const cell=boardEl.children[id];
    if(cell) cell.classList.add("pop");
  }
}
function collapse(){
  for(let c=0;c<COLS;c++){
    let write=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){
      if(board[r][c]!==null){
        board[write][c]=board[r][c];
        if(write!==r) board[r][c]=null;
        write--;
      }
    }
  }
}
function refill(){
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++)
    if(board[r][c]===null) board[r][c]=randCandy();
}
function hasPossibleMove(){
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const dirs=[[1,0],[0,1]];
    for(const [dr,dc] of dirs){
      const nr=r+dr,nc=c+dc;
      if(!inBounds(nr,nc)) continue;
      swap({r,c},{r:nr,c:nc});
      const ok=findMatches().size>0;
      swap({r,c},{r:nr,c:nc});
      if(ok) return true;
    }
  }
  return false;
}
function ensurePossibleMove(){
  let tries=0;
  while(!hasPossibleMove() && tries<30){
    const flat=board.flat().sort(()=>Math.random()-.5);
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) board[r][c]=flat[idx(r,c)];
    if(findMatches().size===0 && hasPossibleMove()) break;
    tries++;
  }
}
function checkEnd(){
  if(score>=goal){
    setTimeout(()=>{
      endTitle.textContent="Level Complete!";
      endText.textContent=`You scored ${score} points with ${moves} moves left.`;
      endOverlay.classList.remove("hidden");
    },250);
  }else if(moves<=0){
    setTimeout(()=>{
      endTitle.textContent="Out of Moves";
      endText.textContent=`You scored ${score}. Target was ${goal}.`;
      endOverlay.classList.remove("hidden");
    },250);
  }
}
function newGame(){
  score=0;moves=25;goal=2500;selected=null;busy=false;
  createBoard();render();
  startOverlay.classList.add("hidden");
  endOverlay.classList.add("hidden");
}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
document.getElementById("startBtn").onclick=newGame;
document.getElementById("restartBtn").onclick=newGame;
createBoard();render();
</script>
</body>
</html>
